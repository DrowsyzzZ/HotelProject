name: 버그
description: 재현 가능한 오류를 등록합니다.
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: 문제
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 순서
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
    validations:
      required: true
  - type: dropdown
    id: viewport
    attributes:
      label: 발생 환경
      options:
        - PC
        - 모바일
        - PC와 모바일 모두
    validations:
      required: true

